<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype ทางรัฐ ภาคธุรกิจ</title>
<link rel="icon" href="assets/tangrat-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ground:#E7ECE9; --ink:#15202E; --muted:#556070; --line:#C9D3CD; --brand:#0B7A4B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#11171A; --ink:#E7EBF0; --muted:#A3AEBB; --line:#2A3438}}
:root[data-theme="dark"]{--ground:#11171A; --ink:#E7EBF0; --muted:#A3AEBB; --line:#2A3438}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
.bar strong{color:var(--ink);font-weight:600}
.bar img{width:28px;height:28px;border-radius:8px}
button{font:inherit;min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--brand)}
.stage{position:relative;flex:0 0 auto}
.phone{width:390px;height:844px;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px #111,0 20px 50px rgba(0,0,0,.25);transform-origin:top left}
.phone iframe{width:390px;height:844px;border:0;display:block}
/* Phone-sized screens: the prototype fills the screen, no frame */
@media (max-width:500px){
  body{padding:0;gap:0;justify-content:flex-start}
  .bar{display:none}
  .phone{border-radius:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="bar">
<img src="assets/tangrat-logo.png" alt="">
<span><strong>ทางรัฐ ภาคธุรกิจ</strong> · ต้นแบบเพื่อการศึกษา · ข้อมูลจำลอง</span>
<button id="restart" type="button">เริ่มใหม่</button>
</div>
<div class="stage" id="stage">
<div class="phone" id="phone"><iframe id="app" title="Prototype ทางรัฐ ภาคธุรกิจ" src="project/Login.dc.html"></iframe></div>
</div>
<script>
(function () {
  var phone = document.getElementById('phone');
  var stage = document.getElementById('stage');
  function fit() {
    var small = window.innerWidth <= 500;
    var availW = small ? window.innerWidth : window.innerWidth - 40;
    var availH = small ? window.innerHeight : window.innerHeight - 90;
    var k = Math.min(availW / 390, availH / 844, small ? 10 : 1);
    phone.style.transform = 'scale(' + k + ')';
    stage.style.width = (390 * k) + 'px';
    stage.style.height = (844 * k) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  document.getElementById('restart').addEventListener('click', function () {
    try {
      Object.keys(window.localStorage).forEach(function (k) {
        if (k.indexOf('tangrat-proto-') === 0) window.localStorage.removeItem(k);
      });
      window.localStorage.setItem('tangrat-proto-epoch', String(Date.now()));
    } catch (e) {}
    document.getElementById('app').src = 'project/Login.dc.html';
  });
})();
</script>
</body>
</html>
