<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แจ้งเตือน - ทางรัฐ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0B7A4B}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item:active{background:#E8F5EE !important}
a:focus-visible{outline:3px solid #86CFA7;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3F6F4; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #15202E; position: relative; overflow: hidden">

<div style="flex: 0 0 auto; background: #FFFFFF; border-bottom: 1px solid #DDE3EC; padding: 12px 12px 12px; display: flex; align-items: center; gap: 8px">
<a href="Home.dc.html" aria-label="ย้อนกลับไปหน้าหลักแอป" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #15202E; background: #F3F6F4">
<svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">แจ้งเตือน</h1>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 10px">

<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<a class="item" href="{{it.href}}" onClick="{{it.pick}}" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid {{it.bd}}; color: #15202E; text-decoration: none">
<span aria-hidden="true" style="flex: 0 0 40px; width: 40px; height: 40px; border-radius: 12px; background: {{it.bg}}; color: {{it.fg}}; display: flex; align-items: center; justify-content: center"><svg class="ic" width="20" height="20" viewBox="0 0 24 24"><path d="{{it.d}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14.5px; font-weight: 600; line-height: 1.4">{{it.title}}</span>
<span style="font-size: 13px; line-height: 1.5; color: #3B4655">{{it.body}}</span>
<span style="font-size: 12px; color: #556070">{{it.time}}</span>
</span>
</a>
</sc-for>

<sc-if value="{{noReqs}}" hint-placeholder-val="{{false}}">
<p style="margin: 8px 0 0; text-align: center; font-size: 13.5px; color: #556070">ยังไม่มีการแจ้งเตือนคำขอ</p>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { reqs: this.readReqs() };
  }
  componentDidMount() {
    this._epoch = this.epoch();
    this._poll = setInterval(() => {
      if (this.epoch() !== this._epoch) { this._epoch = this.epoch(); this.setState({ reqs: [] }); return; }
      const reqs = this.readReqs();
      if (JSON.stringify(reqs) !== JSON.stringify(this.state.reqs)) this.setState({ reqs: reqs });
    }, 800);
  }
  componentWillUnmount() { clearInterval(this._poll); }
  epoch() {
    try { return window.localStorage.getItem('tangrat-proto-epoch') || ''; } catch (e) { return ''; }
  }
  readReqs() {
    try {
      const v = window.localStorage.getItem('tangrat-proto-reqs');
      const a = v ? JSON.parse(v) : [];
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  renderVals() {
    const s = this.state;
    const bell = 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0';
    const check = 'M20 6 9 17l-5-5';
    const warn = 'M12 3 2 20h20zM12 10v4M12 17h.01';
    const doc = 'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5';
    const items = s.reqs.slice().reverse().map((r) => {
      const no = r.no || 'REQ-6911-004521';
      const base = (r.title || 'คำขอ') + ' · ' + no;
      if (r.sim === 'approved') return { title: 'คำขอได้รับอนุมัติ (จำลอง)', body: base + ' · ' + (r.result || 'เอกสาร') + 'พร้อมแล้ว', d: check, bg: '#0B7A4B', fg: '#FFFFFF', bd: '#9FD3BA', href: 'Tracking.dc.html', pick: () => { try { window.localStorage.setItem('tangrat-proto-back-tracking', 'Notifications.dc.html'); } catch (e) {} }, time: 'เมื่อสักครู่' };
      if (r.sim === 'more') return { title: 'เจ้าหน้าที่ขอเอกสารเพิ่มเติม', body: base + ' · แตะเพื่อแนบเอกสาร', d: warn, bg: '#FFF1DB', fg: '#8A4B00', bd: '#F2C77A', href: 'Tracking.dc.html', pick: () => { try { window.localStorage.setItem('tangrat-proto-back-tracking', 'Notifications.dc.html'); } catch (e) {} }, time: 'เมื่อสักครู่' };
      if (r.resubmitted) return { title: 'ได้รับเอกสารที่แก้ไขแล้ว', body: base + ' · กำลังพิจารณาอีกครั้ง', d: doc, bg: '#E8F5EE', fg: '#0B7A4B', bd: '#DDE3EC', href: 'Tracking.dc.html', pick: () => { try { window.localStorage.setItem('tangrat-proto-back-tracking', 'Notifications.dc.html'); } catch (e) {} }, time: 'เมื่อสักครู่' };
      return { title: 'ส่งคำขอเรียบร้อยแล้ว', body: base + ' · กำลังพิจารณา', d: doc, bg: '#E8F5EE', fg: '#0B7A4B', bd: '#DDE3EC', href: 'Tracking.dc.html', pick: () => { try { window.localStorage.setItem('tangrat-proto-back-tracking', 'Notifications.dc.html'); } catch (e) {} }, time: 'เมื่อสักครู่' };
    });
    items.push({ title: 'ยินดีต้อนรับสู่บริการภาคธุรกิจ', body: 'จดทะเบียนและติดตามคำขอได้ที่นี่', d: bell, bg: '#F3F6F4', fg: '#556070', bd: '#DDE3EC', href: 'Main.dc.html', pick: () => {}, time: 'วันนี้' });
    return { items: items, noReqs: s.reqs.length === 0 };
  }
}
</script>
</body>
</html>
