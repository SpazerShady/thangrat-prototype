<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หน้าหลักแอป - ทางรัฐ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0B7A4B}a:hover{color:#075234}
button{font:inherit}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile{transition:background .12s,border-color .12s}
.tile:active{background:#E8F5EE !important;border-color:#0B7A4B !important}
button:focus-visible,a:focus-visible{outline:3px solid #86CFA7;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F9F8; font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #15202E; position: relative; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 0 20px">

<header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: #FFFFFF">
<div aria-hidden="true" style="flex: 0 0 40px; width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DDE3EC; overflow: hidden; display: flex; align-items: center; justify-content: center"><img src="/_blob/745e58c465e92bf487df051d92f4d186" alt="" style="width: 100%; height: 100%; object-fit: contain; display: block"></div>
<button onClick="{{searchPick}}" style="flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDE3EC; background: #F3F6F4; color: #556070; font-size: 14px; text-align: left; cursor: pointer">
<svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 18px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">ค้นหาบริการ เช่น ประกันสังคม</span>
</button>
<button aria-label="ถาม AI" onClick="{{aiPick}}" style="flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; border: none; background: #E8F5EE; color: #075234; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"></path></svg>
</button>
<a href="Notifications.dc.html" aria-label="{{bellLabel}}" style="position: relative; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px; background: #F3F6F4; color: #15202E; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg class="ic" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 3px; right: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #C62828; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{badgeCount}}</span></sc-if>
</a>
</header>

<section aria-label="ประกาศ" style="background: #FFFFFF; padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="min-height: 150px; border-radius: 16px; background: #075234; color: #FFFFFF; padding: 20px; display: flex; flex-direction: column; justify-content: center; gap: 8px">
<span style="font-size: 12.5px; color: #BFE3CF">{{slideTag}}</span>
<span style="font-size: 20px; font-weight: 700; line-height: 1.35">{{slideTitle}}</span>
<span style="font-size: 13.5px; line-height: 1.5; color: #D7EFE2">{{slideBody}}</span>
</div>
<div style="display: flex; justify-content: center; gap: 4px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
<button aria-label="{{d.label}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="width: 32px; height: 32px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: {{d.w}}; height: 6px; border-radius: 3px; background: {{d.bg}}"></span></button>
</sc-for>
</div>
</section>

<section style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">สวัสดี คุณสมชาย ใจดี</h1>


<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<sc-if value="{{t.isLink}}" hint-placeholder-val="{{true}}">
<a class="tile" href="{{t.href}}" onClick="{{t.pick}}" style="min-height: 112px; padding: 12px 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDE3EC; color: #15202E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; text-decoration: none">
<svg class="ic" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" style="color: #0B7A4B"><path d="{{t.d}}"></path></svg>
<span style="font-size: 13.5px; font-weight: 500; line-height: 1.35">{{t.label}}</span>
</a>
</sc-if>
<sc-if value="{{t.isBtn}}" hint-placeholder-val="{{false}}">
<button class="tile" onClick="{{t.pick}}" style="min-height: 112px; padding: 12px 6px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDE3EC; color: #15202E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; cursor: pointer">
<svg class="ic" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" style="color: #0B7A4B"><path d="{{t.d}}"></path></svg>
<span style="font-size: 13.5px; font-weight: 500; line-height: 1.35">{{t.label}}</span>
</button>
</sc-if>
</sc-for>
</div>
</section>

<section style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; padding-left: 10px; border-left: 4px solid #0B7A4B; font-size: 17px; font-weight: 600">บริการโปรด</h2>
<button onClick="{{seeAll}}" style="min-height: 44px; border: none; background: transparent; color: #0B7A4B; font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer">ดูทั้งหมด</button>
</div>
<div>
<button class="tile" onClick="{{editFav}}" style="width: 104px; min-height: 120px; padding: 10px 6px; border-radius: 14px; background: #FFFFFF; border: 1.5px dashed #C5CEDB; color: #3B4655; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; cursor: pointer">
<span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; border: 1px dashed #C5CEDB; background: #F7F9F8; display: flex; align-items: center; justify-content: center"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></span>
<span style="font-size: 13.5px; line-height: 1.35">แก้ไขบริการโปรด</span>
</button>
</div>
</section>

<section style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; padding-left: 10px; border-left: 4px solid #0B7A4B; font-size: 17px; font-weight: 600; line-height: 1.35">บริการตามความสนใจ</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{lifeCards}}" as="lc" hint-placeholder-count="4">
<button class="tile" onClick="{{lc.pick}}" style="min-height: 72px; padding: 10px 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDE3EC; color: #15202E; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: 0 0 38px; width: 38px; height: 38px; border-radius: 10px; background: #E8F5EE; color: #0B7A4B; display: flex; align-items: center; justify-content: center"><svg class="ic" width="20" height="20" viewBox="0 0 24 24"><path d="{{lc.d}}"></path></svg></span>
<span style="font-size: 13.5px; font-weight: 500; line-height: 1.35">{{lc.label}}</span>
</button>
</sc-for>
</div>
<p style="margin: 4px 0 0; text-align: center; font-size: 12.5px; color: #556070">ต้นแบบเพื่อการศึกษา · ข้อมูลจำลอง</p>
</section>

</div>

<nav aria-label="เมนูหลัก" style="flex: 0 0 auto; position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; background: #FFFFFF; border-top: 1px solid #DDE3EC; padding: 6px 2px 14px">
<a href="Home.dc.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #0B7A4B; text-decoration: none; font-size: 11px; font-weight: 600; white-space: nowrap">
<svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>หน้าหลัก</a>
<button onClick="{{walletMoney}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #556070; border: none; background: transparent; font-size: 11px; white-space: nowrap; padding: 0; cursor: pointer">
<svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v14H3zM3 10h18M16 15h2"></path></svg>กระเป๋าเงิน</button>
<div style="display: flex; justify-content: center">
<button aria-label="สแกน" onClick="{{scanPick}}" style="width: 58px; height: 58px; margin-top: -26px; border-radius: 18px; border: 4px solid #FFFFFF; background: #0B7A4B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(7,82,52,0.3)">
<svg class="ic" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"></path></svg>
</button>
</div>
<button onClick="{{seeAll}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #556070; border: none; background: transparent; font-size: 11px; white-space: nowrap; padding: 0; cursor: pointer">
<svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"></path></svg>บริการทั้งหมด</button>
<button onClick="{{toggleSheet}}" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #556070; border: none; background: transparent; font-size: 11px; white-space: nowrap; padding: 0; cursor: pointer">
<svg class="ic" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>อื่นๆ</button>
</nav>

<sc-if value="{{showSheet}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 20">
<button aria-label="ปิด" onClick="{{toggleSheet}}" style="flex: 1; border: none; background: rgba(21,32,46,0.35); cursor: pointer"></button>
<div style="background: #FFFFFF; padding: 18px 16px 24px; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid #DDE3EC">
<div aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: #E8F5EE; color: #075234; display: flex; align-items: center; justify-content: center; font-weight: 700">สจ</div>
<div style="display: flex; flex-direction: column; flex: 1">
<span style="font-size: 16px; font-weight: 600">สมชาย ใจดี</span>
<span style="font-size: 13px; color: #0E7A4F">ยืนยันตัวตน (e-KYC) แล้ว</span>
</div>
<button aria-label="ปิดเมนู" onClick="{{toggleSheet}}" style="width: 44px; height: 44px; border: none; background: #F3F6F4; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #15202E; cursor: pointer">
<svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
</div>
<sc-for list="{{sheetItems}}" as="it" hint-placeholder-count="3">
<button onClick="{{it.pick}}" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; border: none; background: transparent; padding: 0; color: #15202E; font-size: 15px; text-align: left; cursor: pointer">{{it.label}}<svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</sc-for>
<a href="Login.dc.html" onClick="{{logout}}" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; color: #B42318; text-decoration: none; font-size: 15px">ออกจากระบบ<svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
</div>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 92px; padding: 12px 16px; border-radius: 14px; background: #15202E; color: #FFFFFF; font-size: 14px; text-align: center; z-index: 30">{{toast}}</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toast: '', showSheet: false, slide: 0, reqs: this.readReqs() };
  }
  componentDidMount() {
    this._epoch = this.epoch();
    this._poll = setInterval(() => {
      if (this.epoch() !== this._epoch) { this._epoch = this.epoch(); this.setState({ toast: '', showSheet: false, slide: 0, reqs: [] }); return; }
      const reqs = this.readReqs();
      if (JSON.stringify(reqs) !== JSON.stringify(this.state.reqs)) this.setState({ reqs: reqs });
    }, 800);
    this._slide = setInterval(() => { this.setState({ slide: (this.state.slide + 1) % 3 }); }, 5000);
  }
  componentWillUnmount() { clearTimeout(this._t); clearInterval(this._poll); clearInterval(this._slide); }
  epoch() {
    try { return window.localStorage.getItem('tangrat-proto-epoch') || ''; } catch (e) { return ''; }
  }
  readReqs() {
    try {
      const v = window.localStorage.getItem('tangrat-proto-reqs');
      const a = v ? JSON.parse(v) : [];
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  setKey(k, v) {
    try { window.localStorage.setItem(k, v); } catch (e) {}
  }
  flash(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg, showSheet: false });
    this._t = setTimeout(() => this.setState({ toast: '' }), 2400);
  }
  renderVals() {
    const s = this.state;
    const out = (label) => () => this.flash('“' + label + '” ยังไม่เปิดในต้นแบบนี้');
    const slides = [
      { tag: 'บริการใหม่', title: 'จดทะเบียนพาณิชย์ผ่านแอปได้แล้ว', body: 'ครบจบในที่เดียว' },
      { tag: 'ติดตามสถานะ', title: 'รู้ความคืบหน้าคำขอทุกขั้นตอน', body: 'แจ้งเตือนเมื่อสถานะเปลี่ยน' },
      { tag: 'เอกสารดิจิทัล', title: 'เก็บเอกสารไว้ในกระเป๋าเอกสาร', body: 'ดาวน์โหลดหรือแชร์ได้' }
    ];
    const cur = slides[s.slide % slides.length];
    const dots = slides.map((x, i) => ({ label: 'ประกาศที่ ' + (i + 1), on: i === s.slide, w: i === s.slide ? '22px' : '6px', bg: i === s.slide ? '#0B7A4B' : '#C5CEDB', pick: () => this.setState({ slide: i }) }));
    const tiles = [
      { label: 'กระเป๋าเอกสาร', d: 'M3 6h18v14H3zM3 10h18M16 15h2', isLink: true, isBtn: false, href: 'Wallet.dc.html', pick: () => this.setKey('tangrat-proto-back-wallet', 'Home.dc.html') },
      { label: 'สวัสดิการ', d: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z', isLink: false, isBtn: true, href: '', pick: out('สวัสดิการ') },
      { label: 'ถาม AI', d: 'M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z', isLink: false, isBtn: true, href: '', pick: out('ถาม AI') },
      { label: 'สายด่วนฉุกเฉิน', d: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z', isLink: false, isBtn: true, href: '', pick: out('สายด่วนฉุกเฉิน') },
      { label: 'บริการภาคธุรกิจ', d: 'M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6', isLink: true, isBtn: false, href: 'Main.dc.html', pick: () => this.setKey('tangrat-proto-nav', 'tiles') },
      { label: 'เอกสารประกอบคำขอ', d: 'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6', isLink: false, isBtn: true, href: '', pick: out('เอกสารประกอบคำขอ') }
    ];
    const lifeCards = [
      { label: 'ธุรกิจและการค้า', d: 'M3 9l2-5h14l2 5M4 9v11h16V9M9 20v-6h6v6' },
      { label: 'การศึกษา', d: 'M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5' },
      { label: 'สุขภาพ', d: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' },
      { label: 'ที่อยู่อาศัยและยานพาหนะ', d: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z' }
    ].map((c) => ({ label: c.label, d: c.d, pick: out(c.label) }));
    const waiting = s.reqs.filter((r) => !r.received);
    const changed = s.reqs.filter((r) => r.sim && r.sim !== 'review' && !r.received);
    return {
      slideTag: cur.tag, slideTitle: cur.title, slideBody: cur.body, dots: dots,
      tiles: tiles, lifeCards: lifeCards,
      hasBadge: changed.length > 0, badgeCount: String(changed.length),
      bellLabel: changed.length ? 'แจ้งเตือน ' + changed.length + ' รายการ' : 'แจ้งเตือน',
      hasWaiting: waiting.length > 0,
      waitingText: 'คำขอของฉัน ' + waiting.length + ' รายการกำลังดำเนินการ',
      searchPick: out('ค้นหาบริการ'), aiPick: out('ถาม AI'), seeAll: out('บริการทั้งหมด'), editFav: out('แก้ไขบริการโปรด'),
      walletMoney: out('กระเป๋าเงิน'), scanPick: out('สแกน'),
      showSheet: s.showSheet,
      toggleSheet: () => this.setState({ showSheet: !this.state.showSheet }),
      sheetItems: ['แก้ไขข้อมูลส่วนตัว', 'เปลี่ยนรหัสผ่าน / ยืนยันตัวตน (e-KYC)', 'ตั้งค่า', 'ติดต่อเจ้าหน้าที่'].map((label) => ({ label: label, pick: out(label) })),
      logout: () => { try { ['case', 'plan', 'main', 'form', 'docs', 'req', 'reqs', 'done', 'fix', 'back-tracking', 'back-wallet', 'nav', 'tab', 'auth'].forEach((k) => window.localStorage.removeItem('tangrat-proto-' + k)); window.localStorage.setItem('tangrat-proto-epoch', String(Date.now())); } catch (e) {} },
      toast: s.toast, hasToast: !!s.toast
    };
  }
}
</script>
</body>
</html>
